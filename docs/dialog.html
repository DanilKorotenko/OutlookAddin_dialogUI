<!DOCTYPE html>
<html lang="en">
<head>
    <title>Message blocked</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 24px;
            color: #252423;
        }
        .message {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 24px;
        }
        .actions {
            text-align: right;
        }
        button {
            min-width: 80px;
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #0078d4;
            color: #fff;
            border: 1px solid #0078d4;
            border-radius: 2px;
        }
        button:hover {
            background: #106ebe;
            border-color: #106ebe;
        }
    </style>
</head>
<body>
    <p class="message">Sending this message is blocked.</p>
    <div class="actions">
        <button type="button" id="okButton">OK</button>
    </div>
    <script type="text/javascript">
        Office.onReady(function () {
                Office.context.ui.messageParent(JSON.stringify({ action: "ok" }));
            document.getElementById("okButton").onclick = function () {
                Office.context.ui.messageParent(JSON.stringify({ action: "ok" }));
            };
        });
    </script>
</body>
</html>
